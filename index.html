<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ノート">
  <meta name="theme-color" content="#3b2718">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>ノート</title>
</head>
<body>
  <!-- 本棚 -->
  <section id="shelf-view" class="view">
    <header class="shelf-header">
      <h1>本棚</h1>
      <div class="shelf-actions">
        <button id="shelf-menu-btn" class="round-btn" aria-label="メニュー">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <button id="add-notebook-btn" class="round-btn add" aria-label="新しいノート">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <div id="shelf" class="shelf"></div>
  </section>

  <!-- ノート編集 -->
  <section id="editor-view" class="view hidden">
    <header class="toolbar">
      <div class="tb-left">
        <button id="back-btn" class="tbtn wide" aria-label="本棚へ">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>本棚</span>
        </button>
        <button id="pages-btn" class="tbtn" aria-label="ページ一覧">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M9.5 4v16"/></svg>
        </button>
        <span id="nb-title"></span>
      </div>
      <div class="tb-center">
        <button id="undo-btn" class="tbtn" aria-label="元に戻す">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="redo-btn" class="tbtn" aria-label="やり直す">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="divider"></span>
        <button id="pen-btn" class="tbtn active" aria-label="ペン">
          <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>
          <span class="pen-dot"></span>
        </button>
        <button id="eraser-btn" class="tbtn" aria-label="消しゴム">
          <svg viewBox="0 0 24 24"><path d="M8 20l-4.3-4.3a1.5 1.5 0 0 1 0-2.1L13.6 3.7a1.5 1.5 0 0 1 2.1 0l4.6 4.6a1.5 1.5 0 0 1 0 2.1L10.8 20z"/><path d="M8 20h12"/><path d="M8.5 9l6.5 6.5"/></svg>
        </button>
        <button id="pen-settings-btn" class="tbtn" aria-label="ペンの設定">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="favorites" class="favorites"></div>
      </div>
      <div class="tb-right">
        <button id="more-btn" class="tbtn" aria-label="メニュー">
          <svg viewBox="0 0 24 24" class="filled"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </header>

    <div class="editor-body">
      <div id="stage" class="stage">
        <canvas id="base-canvas"></canvas>
        <canvas id="live-canvas"></canvas>
      </div>
      <div class="page-indicator">
        <button id="prev-btn" aria-label="前のページ">‹</button>
        <span id="page-num">1/1</span>
        <button id="next-btn" aria-label="次のページ">›</button>
      </div>

      <aside id="pages-panel" class="pages-panel">
        <div class="pp-head">
          <span>ページ一覧</span>
          <button id="pages-close" class="tbtn" aria-label="閉じる">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div id="pages-list" class="pages-list"></div>
        <button id="add-page-btn" class="add-page-btn">＋ ページを追加</button>
      </aside>

      <div id="pen-panel" class="popover hidden"></div>
    </div>
  </section>

  <div id="menu-backdrop" class="menu-backdrop hidden"></div>
  <div id="menu" class="context-menu hidden"></div>
  <div id="dialog" class="dialog-backdrop hidden"><div class="dialog"></div></div>
  <div id="toast" class="toast hidden"></div>
  <input id="import-input" type="file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
